<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de Ràdio Industrial Jove</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #f5f5f5; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    h1 { color: #333; margin-bottom: 30px; }
    
    .editor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    
    .panel {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .panel h2 {
      font-size: 16px;
      margin-bottom: 15px;
      color: #333;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
      color: #666;
    }
    
    input[type="text"],
    input[type="color"],
    textarea,
    select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
    }
    
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    
    button {
      background: #007AFF;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    
    button:hover {
      background: #0051D5;
    }
    
    .preview {
      padding: 20px;
      background: #faf9f5;
      border-radius: 8px;
      margin-top: 10px;
    }
    
    .color-input {
      display: flex;
      gap: 10px;
    }
    
    .color-input input[type="color"] {
      width: 50px;
      cursor: pointer;
    }
    
    .color-input input[type="text"] {
      flex: 1;
    }
    
    .status {
      padding: 10px 15px;
      border-radius: 4px;
      margin-top: 10px;
      font-size: 14px;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    
    .history {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
    }
    
    .history-item {
      padding: 8px;
      border-bottom: 1px solid #eee;
      font-size: 12px;
      color: #666;
    }
    
    .history-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📻 Editor de Ràdio Industrial Jove</h1>
    
    <div class="editor-grid">
      <!-- Panel: Contenido -->
      <div class="panel">
        <h2>Contenido</h2>
        
        <div class="form-group">
          <label>Título principal</label>
          <input type="text" id="titleInput" placeholder="Ej: Ràdio Industrial Jove">
        </div>
        
        <div class="form-group">
          <label>Subtítulo</label>
          <input type="text" id="subtitleInput" placeholder="Ej: La radio de los estudiantes">
        </div>
        
        <div class="form-group">
          <label>Descripción</label>
          <textarea id="descriptionInput" placeholder="Escribe la descripción..."></textarea>
        </div>
        
        <button onclick="updateContent()">Actualizar Contenido</button>
        <div id="contentStatus"></div>
      </div>
      
      <!-- Panel: Estilos -->
      <div class="panel">
        <h2>Estilos</h2>
        
        <div class="form-group">
          <label>Color de fondo</label>
          <div class="color-input">
            <input type="color" id="bgColor" value="#faf9f5">
            <input type="text" id="bgColorText" value="#faf9f5">
          </div>
        </div>
        
        <div class="form-group">
          <label>Color de texto</label>
          <div class="color-input">
            <input type="color" id="textColor" value="#333333">
            <input type="text" id="textColorText" value="#333333">
          </div>
        </div>
        
        <div class="form-group">
          <label>Color de acento</label>
          <div class="color-input">
            <input type="color" id="accentColor" value="#007AFF">
            <input type="text" id="accentColorText" value="#007AFF">
          </div>
        </div>
        
        <button onclick="updateStyles()">Aplicar Estilos</button>
        <div id="styleStatus"></div>
      </div>
    </div>
    
    <!-- Panel: Chat con Claude -->
    <div class="panel">
      <h2>Chat de Edición (Claude)</h2>
      
      <div class="form-group">
        <label>Comandos disponibles:</label>
        <p style="color: #666; font-size: 13px;">
          • "Cambiar título a..." <br>
          • "Cambiar color de fondo a..." <br>
          • "Cambiar descripción a..." <br>
          • "Generar contenido sobre..."
        </p>
      </div>
      
      <div class="form-group">
        <label>Pregunta o comando</label>
        <textarea id="chatInput" placeholder="Ej: Cambia el título a 'Mi Radio' y el fondo a azul"></textarea>
      </div>
      
      <button onclick="sendChat()">Enviar a Claude</button>
      <div id="chatStatus"></div>
      
      <div class="form-group" style="margin-top: 15px;">
        <label>Historial</label>
        <div class="history" id="history"></div>
      </div>
    </div>
  </div>
  
  <script>
    const API_BASE = '';
    let editHistory = [];
    
    // Sincronizar colores entre input color y text
    document.getElementById('bgColor').addEventListener('input', (e) => {
      document.getElementById('bgColorText').value = e.target.value;
    });
    document.getElementById('bgColorText').addEventListener('input', (e) => {
      document.getElementById('bgColor').value = e.target.value;
    });
    document.getElementById('textColor').addEventListener('input', (e) => {
      document.getElementById('textColorText').value = e.target.value;
    });
    document.getElementById('textColorText').addEventListener('input', (e) => {
      document.getElementById('textColor').value = e.target.value;
    });
    document.getElementById('accentColor').addEventListener('input', (e) => {
      document.getElementById('accentColorText').value = e.target.value;
    });
    document.getElementById('accentColorText').addEventListener('input', (e) => {
      document.getElementById('accentColor').value = e.target.value;
    });
    
    async function updateContent() {
      const title = document.getElementById('titleInput').value;
      const subtitle = document.getElementById('subtitleInput').value;
      const description = document.getElementById('descriptionInput').value;
      
      try {
        const response = await fetch(`${API_BASE}/api/update-content`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title, subtitle, description })
        });
        
        if (response.ok) {
          showStatus('contentStatus', 'Contenido actualizado', 'success');
          addHistory('Contenido actualizado');
        } else {
          showStatus('contentStatus', 'Error al actualizar', 'error');
        }
      } catch (error) {
        showStatus('contentStatus', 'Error: ' + error.message, 'error');
      }
    }
    
    async function updateStyles() {
      const bgColor = document.getElementById('bgColor').value;
      const textColor = document.getElementById('textColor').value;
      const accentColor = document.getElementById('accentColor').value;
      
      try {
        const response = await fetch(`${API_BASE}/api/update-styles`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ bgColor, textColor, accentColor })
        });
        
        if (response.ok) {
          showStatus('styleStatus', 'Estilos aplicados', 'success');
          addHistory('Estilos actualizados');
        } else {
          showStatus('styleStatus', 'Error al actualizar', 'error');
        }
      } catch (error) {
        showStatus('styleStatus', 'Error: ' + error.message, 'error');
      }
    }
    
    async function sendChat() {
      const message = document.getElementById('chatInput').value;
      
      if (!message.trim()) return;
      
      try {
        showStatus('chatStatus', 'Procesando...', '');
        
        const response = await fetch(`${API_BASE}/api/claude`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message })
        });
        
        const data = await response.json();
        
        if (data.success) {
          showStatus('chatStatus', 'Respuesta recibida', 'success');
          addHistory(`Tú: ${message}`);
          addHistory(`Claude: ${data.response}`);
          document.getElementById('chatInput').value = '';
        } else {
          showStatus('chatStatus', 'Error: ' + data.error, 'error');
        }
      } catch (error) {
        showStatus('chatStatus', 'Error: ' + error.message, 'error');
      }
    }
    
    function showStatus(elementId, message, type) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.className = `status ${type}`;
    }
    
    function addHistory(item) {
      editHistory.unshift(item);
      if (editHistory.length > 20) editHistory.pop();
      updateHistory();
    }
    
    function updateHistory() {
      const historyEl = document.getElementById('history');
      historyEl.innerHTML = editHistory.map(item => 
        `<div class="history-item">${new Date().toLocaleTimeString()}: ${item}</div>`
      ).join('');
    }
    
    // Cargar valores guardados
    window.addEventListener('load', () => {
      addHistory('Editor cargado');
    });
  </script>
</body>
</html>
